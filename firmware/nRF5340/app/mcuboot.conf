# Serial recovery: lets a new signed image be uploaded over UART (mcumgr/SMP) without SWD. Mirrors Nordic's own
# bootloader/mcuboot/boot/zephyr/serial_recovery.conf.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_CONSOLE=n

# Entered by holding the pin aliased as `mcuboot-button0` (P1.15) low at
# reset - see app/boards/mcuboot-nrf5340dk_nrf5340_cpunet.overlay /
# mcuboot-gateway.overlay.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y

# Must match the key type generated by `make dfu-keygen` (ed25519). The default here is RSA-2048, which would silently expect a different key.
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
