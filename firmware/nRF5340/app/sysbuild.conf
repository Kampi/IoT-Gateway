# Sysbuild configuration for the OpenThread coprocessor (RCP) build.
#
# Adds MCUboot as a chain-loaded child image so the RCP firmware can be
# swapped later via MCUboot's serial recovery (mcumgr over the same UART
# used for Spinel) instead of requiring SWD access every time. See
# ../README.md, section "DFU / Bootloader".
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Must match the key type generated by `make dfu-keygen` (ed25519) and
# app/mcuboot.conf's CONFIG_BOOT_SIGNATURE_TYPE_ED25519. The sysbuild
# default is RSA, which expects a different key file/format.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y

# THE authoritative switch for single-slot MCUboot (nrf/sysbuild/Kconfig.mcuboot).
# This is what actually configures the MCUboot child image's
# CONFIG_SINGLE_APPLICATION_SLOT and propagates the matching
# CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP to the app image - setting
# either of those directly (in app/mcuboot.conf or app/prj.conf) without
# this is silently overridden by sysbuild's generated .config.sysbuild.
#
# Net core flash is only 256 KiB, and the RCP application alone is ~125 KiB (~139 KiB signed).
# Two slots big enough to hold it (~278 KiB) do not fit at any partition split, so classic
# two-slot A/B DFU (swap OR overwrite-only) is not an option here. See
# app/boards/partitions.overlay for the resulting single-slot partition
# table, and app/mcuboot.conf for the DFU trade-off this implies.
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
