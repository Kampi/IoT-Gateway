# Do NOT enable CONFIG_LOG: this UART also carries Spinel/HDLC binary
# traffic to otbr-agent. Interleaved plaintext log output desyncs the
# HDLC framing on both ends - confirmed on real hardware: with logging
# on, otbr-agent got zero response to any Spinel command (not even
# RESET), even though the raw physical UART link (baud/wiring) was
# independently verified working via `cat`. If you need boot-time
# debug output while bringing up new hardware, use the heartbeat LED
# (app/heartbeat_led/) or a separate UART instead.
CONFIG_LOG=n

CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

CONFIG_OPENTHREAD_COPROCESSOR=y
CONFIG_OPENTHREAD_COPROCESSOR_RCP=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_RCP=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NETWORKING=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_GPIO=n
