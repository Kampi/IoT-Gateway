# DK-only test build: visual liveness indicator, see app/heartbeat_led/.
CONFIG_APP_HEARTBEAT_LED=y

# The RCP UART (net core UART0, P1.01 TxD / P1.00 RxD) carries binary
# Spinel/HDLC only: no boot banner or console output on it, they corrupt the
# HDLC framing ("*** Booting nRF Connect SDK" right after the reset frame).
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
