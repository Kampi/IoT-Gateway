[platformio]
src_dir = src
default_envs = debug

[env]
board = esp-wrover-kit

platform = espressif32@8.0.0
framework = espidf

# 4 MB module version
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv

board_build.filesystem = littlefs
board_build.embed_txtfiles =

# Settings for serial upload
upload_speed = 921600
upload_port = COM22

# Settings for serial console
monitor_speed = 115200
monitor_port = COM22
monitor_filters = esp32_exception_decoder

# Additional packages
platform_packages =

# Aditional build scripts for all environments to run before (`pre`) and after (`post`) the main build script
extra_scripts =
    pre:scripts/Clean.py

# Common build flags for all environments
build_flags =

lib_deps =

[env:debug]
build_type = debug

build_flags =
    ${env.build_flags}
    -D DEBUG

lib_deps =
    ${env.lib_deps}
    ${env.lib_deps}

[env:release]
build_type = release

build_flags =
    ${env.build_flags}
    -D RELEASE

lib_deps =
    ${env.lib_deps}
    ${env.lib_deps}

extra_scripts =
    ${env.extra_scripts}