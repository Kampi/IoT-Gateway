[platformio]
src_dir = src
default_envs = debug

[env]
board = esp-wrover-kit

platform = espressif32@8.0.0
framework = espidf

# 4 MB module version
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv

# Serial port is auto-detected, override with --upload-port / --monitor-port
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:debug]
build_type = debug
build_flags = -D DEBUG

[env:release]
build_type = release
build_flags = -D RELEASE
