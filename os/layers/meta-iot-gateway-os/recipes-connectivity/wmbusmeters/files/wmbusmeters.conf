loglevel=normal
# Receiver: IMST iM871A on UART_1 (/dev/wmbus), see WMBUSMETERS_DEVICE.
# Never use "auto": it probes every serial USB device, including the LoRa
# concentrator (/dev/lora), while the packet forwarder is using it.
device=@WMBUSMETERS_DEVICE@
logfile=/var/log/wmbusmeters/wmbusmeters.log
logtelegrams=false
format=json
# wmbusmeters has no MQTT client of its own: publish every decoded telegram
# with mosquitto_pub (topic wmbusmeters/<meter name>).
shell=/usr/bin/mosquitto_pub -L "mqtt://@WMBUSMETERS_MQTT_SERVER@/wmbusmeters/$METER_NAME" -m "$METER_JSON"
