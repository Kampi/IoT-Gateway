# dnsmasq config for captive-portal AP mode.
# Binds only to mlan0 so it doesn't conflict with system DNS on other interfaces.

interface=uap0
bind-interfaces
no-resolv
no-poll

# DHCP pool for connecting clients
dhcp-range=192.168.4.10,192.168.4.100,1h

# Default gateway and DNS point to the gateway itself
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# Redirect ALL DNS queries to the captive portal IP.
# This triggers OS captive-portal detection on iOS, Android and Windows.
address=/#/192.168.4.1

# Do not read /etc/hosts or /etc/resolv.conf
no-hosts
