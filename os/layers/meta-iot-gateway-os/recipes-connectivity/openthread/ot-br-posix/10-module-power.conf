# Drop-in for the upstream otbr-agent.service: switch on the nRF5340
# (power, out of reset, no MCUboot serial recovery) before the agent starts.
# See gateway-module-power.
[Unit]
Requires=module-power@thread.service
After=module-power@thread.service

[Service]
# Give the nRF5340 (MCUboot + RCP firmware) time to boot after power-up.
ExecStartPre=/bin/sleep 2
