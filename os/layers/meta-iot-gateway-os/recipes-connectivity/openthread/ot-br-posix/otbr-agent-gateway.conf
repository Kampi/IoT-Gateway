# otbr-agent configuration for IoT Gateway
# Loaded by otbr-agent.service via EnvironmentFile=

# RCP: nRF5340 with OpenThread RCP firmware (firmware/nRF5340) on Verdin
# UART_4. 115200 baud, no flow control - must match the RCP.
# The baud rate must be given explicitly: newer ot-br-posix versions default
# to 460800 and then fail with "Wait for response timeout" / "Init() at
# spinel_driver.cpp: Failure".
OTBR_AGENT_OPTS="-I wpan0 -B @OTBR_INFRA_IFACE@ spinel+hdlc+uart://@OTBR_RCP_DEVICE@?uart-baudrate=115200 trel://@OTBR_INFRA_IFACE@"
