# Border routing: forward IPv6 between the infra interface (OTBR_INFRA_IFACE)
# and wpan0. Without this, LAN hosts (e.g. the Home Assistant Matter server)
# can resolve Thread devices via mDNS but never reach them.
net.ipv6.conf.all.forwarding = 1
# Forwarding makes the kernel ignore Router Advertisements unless accept_ra=2.
# Keeps kernel SLAAC/default route working on interfaces not managed by
# NetworkManager (NM handles RAs itself).
net.ipv6.conf.default.accept_ra = 2
