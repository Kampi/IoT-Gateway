require conf/distro/poky.conf

# After poky.conf, which sets its own DISTRO* values (DISTRO_VERSION would be
# the Poky version, e.g. 5.0.18). DISTRO_VERSION is the GatewayOS version in
# /etc/os-release, the RAUC bundle and the Easy Installer image.
DISTRO = "gateway-os"
DISTRO_NAME = "GatewayOS (Robust Multi-Protocol IoT Gateway OS)"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "scarthgap-based"
MAINTAINER = "Daniel Kampert <kontakt@daniel-kampert.de>"

INIT_MANAGER = "systemd"

# @USER_CONFIG: Target hardware: "mainboard" (IoT-Gateway PCB, see gateway/) or "dahlia" (Verdin Dahlia dev setup with nRF5340-DK as Thread RCP on UART_1)
GATEWAY_BOARD ?= "mainboard"

# Adds the override "board-<GATEWAY_BOARD>" (e.g. board-dahlia). Recipes use it
# for board-specific settings (VAR:board-dahlia = ...) and files: a file in
# files/board-dahlia/ replaces the one in files/ (FILESOVERRIDES).
DISTROOVERRIDES:append = ":board-${GATEWAY_BOARD}"

# Serial console: Verdin UART_3 (/dev/ttymxc0) on Dahlia (FTDI, USB-C X18),
# Verdin UART_1 (/dev/ttymxc1, header X901) on the mainboard, where UART_3
# is the Zigbee module (README "UARTs"). No getty on the Zigbee UART.
SERIAL_CONSOLES:board-mainboard = "115200;ttymxc1"

hostname:pn-base-files = "iot-gateway"

DISTRO_FEATURES:append = " pam virtualization wifi bluetooth overlayfs rauc"

# All signing keys (RAUC, nRF5340 MCUboot) and the SSH key, see os/keys/README.md.
# The default folder holds public DEBUG keys, set your own folder for gateways in the field.
# @USER_CONFIG: Folder with the signing keys (rauc/, nrf5340/), default: public debug keys in os/keys
GATEWAY_KEYS_DIR ?= "${TOPDIR}/../keys"

# A/B update layout on the eMMC (RAUC): BOOT (boot script), rootfs A,
# rootfs B, DATA (/etc, /var/lib and /home overlays, rest of the eMMC)
# @USER_CONFIG: Size of each of the two rootfs slots in MiB (A/B updates with RAUC)
GATEWAY_ROOTFS_SLOT_SIZE ?= "4096"

DISTRO_FEATURES:remove = "x11 wayland 3g alsa opengl vulkan"

PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve"
VIRTUAL-RUNTIME_net_manager = "networkmanager"
