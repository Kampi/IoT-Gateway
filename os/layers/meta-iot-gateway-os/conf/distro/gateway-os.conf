DISTRO = "gateway-os"
DISTRO_NAME = "GatewayOS (Robust Multi-Protocol IoT Gateway OS)"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "scarthgap-based"
MAINTAINER = "Daniel Kampert <kontakt@daniel-kampert.de>"

require conf/distro/poky.conf

INIT_MANAGER = "systemd"

# @USER_CONFIG: Target hardware: "mainboard" (IoT-Gateway PCB, see gateway/) or "dahlia" (Verdin Dahlia dev setup with nRF5340-DK as Thread RCP on UART_1)
GATEWAY_BOARD ?= "mainboard"

# Adds the override "board-<GATEWAY_BOARD>" (e.g. board-dahlia). Recipes use it
# for board-specific settings (VAR:board-dahlia = ...) and files: a file in
# files/board-dahlia/ replaces the one in files/ (FILESOVERRIDES).
DISTROOVERRIDES:append = ":board-${GATEWAY_BOARD}"

hostname:pn-base-files = "iot-gateway"

DISTRO_FEATURES:append = " pam virtualization wifi bluetooth overlayfs"
DISTRO_FEATURES:remove = "x11 wayland 3g alsa opengl vulkan"

PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve"
VIRTUAL-RUNTIME_net_manager = "networkmanager"
