# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-iot-gateway-os"
BBFILE_PATTERN_meta-iot-gateway-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-iot-gateway-os = "6"

LAYERDEPENDS_meta-iot-gateway-os = "core"
LAYERSERIES_COMPAT_meta-iot-gateway-os = "scarthgap"

include conf/machine/verdin-imx8mm-extra.conf