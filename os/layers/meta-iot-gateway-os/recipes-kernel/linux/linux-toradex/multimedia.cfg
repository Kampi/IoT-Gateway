# Headless gateway - no camera/display/video capture hardware is used
# (DISTRO_FEATURES already removes x11/wayland/opengl/vulkan/alsa, see
# meta-iot-gateway-os/conf/distro/gateway-os.conf). Disabling the whole
# V4L2/media subsystem removes every /dev/video* node and driver under
# it (ISI/CSI capture, PXP, media controller, ...) that the base BSP
# kernel defconfig otherwise enables by default.
CONFIG_MEDIA_SUPPORT=n
