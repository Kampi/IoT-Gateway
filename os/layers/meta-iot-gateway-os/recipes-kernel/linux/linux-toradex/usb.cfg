# USB driver hardening for IoT Gateway
# Keep: USB core, ChipIdea (iMX8MM), XHCI/EHCI host, CDC-ACM (RAK5146), USB Storage

# USB Audio / Video (no multimedia hardware) 
CONFIG_USB_AUDIO=n
CONFIG_USB_VIDEO_CLASS=n

# USB Gadget / Device mode (host-only system) 
CONFIG_USB_GADGET=n
CONFIG_USB_CONFIGFS=n
CONFIG_USB_ETH=n
CONFIG_USB_G_SERIAL=n
CONFIG_USB_ZERO=n

# USB Network adapters (dedicated Ethernet on Verdin) 
CONFIG_USB_LAN78XX=n
CONFIG_USB_NET_DM9601=n
CONFIG_USB_NET_MCS7830=n
CONFIG_USB_NET_PLUSB=n
CONFIG_USB_NET_SMSC75XX=n
CONFIG_USB_NET_SMSC95XX=n
CONFIG_USB_NET_SR9800=n
CONFIG_USB_PEGASUS=n
CONFIG_USB_RTL8150=n
CONFIG_USB_RTL8152=n
CONFIG_USB_USBNET=n

# USB Serial (CDC-ACM for RAK5146 is separate and kept) 
CONFIG_USB_SERIAL=n
CONFIG_USB_SERIAL_CP210X=n
CONFIG_USB_SERIAL_FTDI_SIO=n
CONFIG_USB_SERIAL_OPTION=n

# USB Test drivers 
CONFIG_USB_TEST=n
CONFIG_USB_EHSET_TEST_FIXTURE=n

# Non-NXP USB host controllers (not present on Verdin iMX8MM) 
CONFIG_USB_BRCMSTB=n
CONFIG_USB_CDNS3=n
CONFIG_USB_CDNS3_GADGET=n
CONFIG_USB_CDNS3_HOST=n
CONFIG_USB_CDNS3_IMX=n
CONFIG_USB_CDNS_SUPPORT=n
CONFIG_USB_EHCI_EXYNOS=n
CONFIG_USB_ISP1760=n
CONFIG_USB_MTU3=n
CONFIG_USB_MUSB_HDRC=n
CONFIG_USB_MUSB_SUNXI=n
CONFIG_USB_OHCI_EXYNOS=n
CONFIG_USB_QCOM_EUD=n
CONFIG_USB_RENESAS_USB3=n
CONFIG_USB_RENESAS_USBHS=n
CONFIG_USB_RENESAS_USBHS_HCD=n
CONFIG_USB_RENESAS_USBHS_UDC=n
CONFIG_USB_RZV2M_USB3DRD=n
CONFIG_USB_TEGRA_XUDC=n
CONFIG_USB_XHCI_PCI_RENESAS=n
CONFIG_USB_XHCI_RZV2M=n
CONFIG_USB_XHCI_TEGRA=n
