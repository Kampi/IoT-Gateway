# /dev/net/tun. Required by otbr-agent to create the `wpan0` Thread
# network interface (platformConfigureTunDevice() in ot-br-posix's
# netif.cpp fails with ENOENT without this).
CONFIG_TUN=y

# IPv6 multicast routing. Required by otbr-agent's Backbone Router (BBR)
# to forward multicast traffic between the Thread network (wpan0) and the
# backbone/infra network.
CONFIG_IPV6_MROUTE=y

# ipset support. Required by otbr-agent's NAT64 (backbone_router/nd_proxy +
# NAT64 translator) to track the Thread-side prefix set - without it,
# otbr-agent fails at startup with "ipset: Cannot open session to kernel"
# as soon as a backbone interface (-B) is given. CONFIG_NETFILTER_XT_SET is
# =m, not =y, because it depends on CONFIG_NETFILTER_XTABLES which is
# already =m in this kernel.
CONFIG_IP_SET=y
CONFIG_IP_SET_HASH_NET=y
CONFIG_NETFILTER_XT_SET=m

# nftables. otbr-agent manages its own NAT64/ingress firewall rules
# (e.g. the "otbr-ingress-allow-dst-swap" chain) via nft, not iptables -
# without CONFIG_NF_TABLES, `nft` can't even initialize its netlink cache
# ("cache initialization failed: Invalid argument"), so none of those
# rules are ever actually installed. That most likely also explains why
# mDNS resolve (SRV/TXT, e.g. via `dns-sd -L`) silently returns nothing
# while plain PTR browsing still works: the intended allow-rule for
# return/unicast traffic never gets programmed, so it falls through to
# whatever the default policy is instead.
CONFIG_NF_TABLES=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_COMPAT=m
