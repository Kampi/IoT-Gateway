# A/B updates with RAUC and persistent data (see README "Updates (RAUC)")

# /sbin/preinit overlays /etc, /var/lib and /home with the DATA partition
# before systemd (and module loading) starts: built in
CONFIG_OVERLAY_FS=y

# RAUC bundles: squashfs image, mounted via loop device, format "verity"
# checked with dm-verity
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y

# RAUC bundle streaming over HTTP (rauc install https://...)
CONFIG_BLK_DEV_NBD=y
