# RAUC A/B layout on the eMMC (see gateway-os-image.bb, gateway_tezi_ab_layout):
#   mmcblk0p1  BOOT   FAT, U-Boot boot script (slot selection)
#   mmcblk0p2  RFS_A  rootfs slot A (kernel + devicetree in /boot)
#   mmcblk0p3  RFS_B  rootfs slot B
#   mmcblk0p4  DATA   /data: overlays for /etc, /var/lib, /home and RAUC state
# U-Boot environment variables BOOT_ORDER / BOOT_A_LEFT / BOOT_B_LEFT select
# the slot (boot.cmd.in); "rauc status mark-good" (rauc-mark-good.service)
# confirms a slot after a successful boot.

[system]
compatible=@RAUC_COMPATIBLE@
bootloader=uboot
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
resize=true
