# gateway-power-monitor configuration (POWER_* in local.conf)
# Loaded by gateway-power-monitor.service via EnvironmentFile=

# Power mux status line (gpio-line-names) and its level on battery
POWER_GPIO_LINE="powermux-status"
POWER_BATTERY_LEVEL="@POWER_BATTERY_LEVEL@"

# Clean shutdown on battery at this charge (%), and/or after this many
# seconds on battery (0 = off)
POWER_SHUTDOWN_PERCENT="@POWER_SHUTDOWN_PERCENT@"
POWER_SHUTDOWN_DELAY="@POWER_SHUTDOWN_DELAY@"

POWER_POLL_INTERVAL="5"
