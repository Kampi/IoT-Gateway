# RAK5146 LoRa concentrator (USB, Verdin USB_2): power enable only (SODIMM 30,
# TLV75733 LDO). Its reset (SODIMM 185) is Verdin USB_2_EN, driven high
# (released) by the kernel's USB_2 VBUS regulator once the USB host is up.
# Started at boot (multi-user.target): lora-packet-forwarder is started by
# udev once the concentrator enumerates, so nothing else pulls this unit in.
[Service]
Environment="MODULE_POWER_LINES=lora-power-enable=1"
