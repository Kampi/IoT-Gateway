# Hardware watchdog (i.MX2 WDT, /dev/watchdog0, max. 128 s): systemd pings it
# every RuntimeWatchdogSec/2. If the kernel or systemd hangs, the SoC resets.
# RebootWatchdogSec limits a hanging reboot/shutdown.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=5min
