# gateway-telemetry configuration
# Loaded by gateway-telemetry.service via EnvironmentFile=

# MQTT broker connection (defaults to the local mosquitto broker)
MQTT_HOST="localhost"
MQTT_PORT="1883"
MQTT_USERNAME=""
MQTT_PASSWORD=""

# Home Assistant MQTT discovery prefix, must match the "Discovery prefix"
# set in Home Assistant's MQTT integration options ("homeassistant" by default)
HA_DISCOVERY_PREFIX="homeassistant"

# Friendly device name shown in Home Assistant
GATEWAY_NAME="IoT Gateway"

# Telemetry publish interval in seconds
TELEMETRY_INTERVAL="30"
