# gateway-telemetry configuration
# Loaded by gateway-telemetry.service via EnvironmentFile=

# MQTT broker connection (TELEMETRY_MQTT_HOST in local.conf, default: local mosquitto)
MQTT_HOST="@TELEMETRY_MQTT_HOST@"
MQTT_PORT="1883"
MQTT_USERNAME=""
MQTT_PASSWORD=""

# Home Assistant MQTT discovery prefix, must match the "Discovery prefix"
# set in Home Assistant's MQTT integration options ("homeassistant" by default)
HA_DISCOVERY_PREFIX="homeassistant"

# Friendly device name shown in Home Assistant
GATEWAY_NAME="@TELEMETRY_DEVICE_NAME@"
# Names of the radio gateway devices, shown as connected devices of GATEWAY_NAME
LORA_DEVICE_NAME="@TELEMETRY_LORA_DEVICE_NAME@"
BLE_DEVICE_NAME="@TELEMETRY_BLE_DEVICE_NAME@"
WMBUS_DEVICE_NAME="@TELEMETRY_WMBUS_DEVICE_NAME@"

# Telemetry publish interval in seconds
TELEMETRY_INTERVAL="30"
