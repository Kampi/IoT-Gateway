# gateway-telemetry configuration
# Loaded by gateway-telemetry.service via EnvironmentFile=

# MQTT broker connection (TELEMETRY_MQTT_HOST in local.conf)
MQTT_HOST="@TELEMETRY_MQTT_HOST@"
MQTT_PORT="1883"
MQTT_USERNAME=""
MQTT_PASSWORD=""

# Home Assistant MQTT discovery prefix, must match the "Discovery prefix"
# set in Home Assistant's MQTT integration options ("homeassistant" by default)
HA_DISCOVERY_PREFIX="homeassistant"

# Friendly device name shown in Home Assistant
GATEWAY_NAME="@TELEMETRY_DEVICE_NAME@"
# Restart the LoRa packet forwarder when the concentrator hangs: no gateway
# stats from the ChirpStack Gateway Bridge for this many seconds (0 = off)
LORA_WATCHDOG_TIMEOUT="300"

# Names of the radio gateway devices, shown as connected devices of GATEWAY_NAME
LORA_DEVICE_NAME="@TELEMETRY_LORA_DEVICE_NAME@"
BLE_DEVICE_NAME="@TELEMETRY_BLE_DEVICE_NAME@"
WMBUS_DEVICE_NAME="@TELEMETRY_WMBUS_DEVICE_NAME@"

# Telemetry publish interval in seconds
TELEMETRY_INTERVAL="30"

# Board revision straps (gpio-line-names, bit 0 first), mainboard only
HARDWARE_VERSION_LINES="@TELEMETRY_HARDWARE_VERSION_LINES@"

# Supply source (mainboard): TPS2121 status lines, mains/battery (1 = battery)
# and DC/PoE (1 = PoE). Empty = no "Power Source" sensor.
POWER_SOURCE_LINES="@TELEMETRY_POWER_SOURCE_LINES@"

# Input voltage: ads1015 channel (in_voltage<N>) and resistor divider ratio
# ((R_top + R_bottom) / R_bottom). Empty channel = no "Input Voltage" sensor.
INPUT_VOLTAGE_CHANNEL="@TELEMETRY_INPUT_VOLTAGE_CHANNEL@"
INPUT_VOLTAGE_DIVIDER="@TELEMETRY_INPUT_VOLTAGE_DIVIDER@"

# OTA updates from Home Assistant: RAUC bundle URL (empty = no update entity),
# check interval in seconds, reboot after a successful install (1/0)
UPDATE_URL="@GATEWAY_UPDATE_URL@"
UPDATE_CHECK_INTERVAL="@GATEWAY_UPDATE_CHECK_INTERVAL@"
UPDATE_REBOOT="@GATEWAY_UPDATE_REBOOT@"
