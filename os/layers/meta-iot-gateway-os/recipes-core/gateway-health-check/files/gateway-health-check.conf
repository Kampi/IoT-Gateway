# gateway-health-check configuration (GATEWAY_HEALTH_* in local.conf)
# Loaded by gateway-health-check.service via EnvironmentFile=

# Units that must be active on the first boot of a new system
HEALTH_UNITS="@GATEWAY_HEALTH_UNITS@"
# "<device>:<unit>": only required while the device exists (USB peripherals)
HEALTH_DEVICE_UNITS="@GATEWAY_HEALTH_DEVICE_UNITS@"
# Seconds to wait for them before rolling back
HEALTH_TIMEOUT="@GATEWAY_HEALTH_TIMEOUT@"
