# =============================================================================
# Pipeline: PCB
# =============================================================================
#
# Trigger:
#   - Manually via GitLab UI (web trigger)
#   - Push to branches 'main', 'master', 'dev' or '*_Dev' (excl. *.md changes)
#   - Push of a tag matching semantic versioning (e.g. 1.0.0)
#
# Function:
#   Generates KiCad PCB project outputs using KiBot (schematics, Gerbers, BoM,
#   3D models, cost estimation, etc.) and handles the full release process:
#     - generate_outputs: Runs KiBot, updates the CHANGELOG on tag pushes,
#       and commits the results back to the branch.
#     - release: Creates a GitLab Release with the generated ZIP artifact.
#       Only runs on tag pushes.
#     - pages: Publishes the generated outputs as GitLab Pages.
#       Only runs on tag pushes or on main/master.
#
# Variables:
#   KICAD_BOARD         - Name of the KiCad PCB file (without extension)
#   KIBOT_CONFIG        - Path to the KiBot main YAML
#   KIBOT_OUTPUT_DIR    - Output subdirectory for KiBot results
#   KIBOT_OUTPUT_PATH   - Root output path for KiBot results
#   KIBOT_INPUT_DIR     - Directory containing the KiCad project and KiBot files
#   KIBOT_VARIANT       - Active KiBot variant (DRAFT / PRELIMINARY / CHECKED / RELEASED)
#   MASTER_BRANCH       - Name of the main branch (main or master)
#
# Secrets (GitLab CI/CD Variables):
#   MOUSER_KEY          - API key for the Mouser distributor (KiCost)
#   DIGIKEY_KEY         - API key for DigiKey
#   TME_KEY             - API key for TME
#   RS_KEY              - API key for RS
#   FARNELL_KEY         - API key for Farnell
#   WORKFLOW_PAT        - Personal Access Token with 'api' and 'write_repository' scopes
# =============================================================================

variables:
  KICAD_BOARD: "Gateway"
  KIBOT_CONFIG: "kibot_yaml/kibot_main.yaml"
  KIBOT_INPUT_DIR: "gateway"
  KIBOT_OUTPUT_DIR: "gateway"
  KIBOT_OUTPUT_PATH: ".."
  KIBOT_VARIANT: "PRELIMINARY"
  MASTER_BRANCH: "main"
  GIT_DEPTH: 0

# ---------------------------------------------------------------------------
# generate_outputs
# ---------------------------------------------------------------------------
pcb:generate_outputs:
  stage: build
  image: ghcr.io/inti-cmnb/kicad9_auto_full:latest

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|dev)$/'
      changes:
        paths:
          - "**/*"
        compare_to: "HEAD~1"
      when: on_success
    - if: '$CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+(\.[0-9]+)?_Dev$/'

  variables:
    MOUSER_KEY: $MOUSER_KEY
    DIGIKEY_KEY: $DIGIKEY_KEY
    TME_KEY: $TME_KEY
    RS_KEY: $RS_KEY
    FARNELL_KEY: $FARNELL_KEY

  before_script:
    - mkdir -p log
    - export DATE=$(date +'%Y-%m-%d %H:%M:%S')
    - git config --global user.email "gitlab-ci-bot@noreply.gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${WORKFLOW_PAT}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git clone https://github.com/Kampi/KiCad.git kicad-library
    - export KICAD_LIBRARY="$(pwd)/kicad-library"
    - sed -i 's/\.wrl/.step/g' ${KIBOT_INPUT_DIR}/${KICAD_BOARD}.kicad_pcb

  script:
    # -------------------------------------------------------------------------
    # Determine variant and VERSION argument
    # -------------------------------------------------------------------------
    - |
      last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
      if [ -n "${CI_COMMIT_TAG}" ]; then
        KIBOT_REVISION="${CI_COMMIT_TAG}"
        KIBOT_VARIANT="RELEASED"
      elif [ -n "${last_tag}" ]; then
        KIBOT_REVISION="${last_tag}+ (Unreleased)"
      else
        KIBOT_REVISION="(Unreleased)"
      fi

      case "${KIBOT_VARIANT}" in
        "DRAFT")
          additional_args="--skip-pre draw_fancy_stackup,erc,drc draft_group"
          ;;
        "PRELIMINARY")
          additional_args="--skip-pre erc,drc all_group"
          ;;
        "CHECKED"|"RELEASED")
          additional_args="all_group"
          ;;
        *)
          echo "Unknown variant: ${KIBOT_VARIANT}"
          exit 1
          ;;
      esac

    # -------------------------------------------------------------------------
    # Update CHANGELOG on tag pushes
    # -------------------------------------------------------------------------
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        git fetch origin main
        git checkout main
        git pull origin main --rebase

        pip install keep-a-changelog 2>/dev/null || true

        python3 -c "
      import re, sys
      content = open('${KIBOT_INPUT_DIR}/CHANGELOG.md').read()
      m = re.search(r'## \[Unreleased\](.*?)(?=\n## \[)', content, re.DOTALL)
      print(m.group(1).strip() if m else '')
      " > release_notes.txt || true

        sed -i "s/## \[Unreleased\]/## [${CI_COMMIT_TAG}] - $(date +'%Y-%m-%d')\n\n## [Unreleased]/" \
          "${KIBOT_INPUT_DIR}/CHANGELOG.md" || true

        prev_tag=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CI_COMMIT_TAG}$" | head -1)
        repo_url="${CI_PROJECT_URL}"
        python3 ./scripts/python/update_changelog_links.py \
          --file "${KIBOT_INPUT_DIR}/CHANGELOG.md" \
          --tag "${CI_COMMIT_TAG}" \
          --prev-tag "${prev_tag}" \
          --repo-url "${repo_url}" || true
      fi

    # -------------------------------------------------------------------------
    # KiBot: Generate notes (skipped for DRAFT)
    # -------------------------------------------------------------------------
    - |
      if [ "${KIBOT_VARIANT}" != "DRAFT" ]; then
        cd ${KIBOT_INPUT_DIR}
        kibot -vvvv -c ${KIBOT_CONFIG} \
          -d ${KIBOT_OUTPUT_PATH}/${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT} \
          -b ${KICAD_BOARD}.kicad_pcb \
          -s all \
          -g variant=${KIBOT_VARIANT} \
          notes 2> ../log/kibot_notes.log
        cd ..
      fi

    # -------------------------------------------------------------------------
    # KiBot: README only (DRAFT variant)
    # -------------------------------------------------------------------------
    - |
      if [ "${KIBOT_VARIANT}" = "DRAFT" ]; then
        cd ${KIBOT_INPUT_DIR}
        kibot -vvvv -c ${KIBOT_CONFIG} \
          -d ${KIBOT_OUTPUT_PATH}/${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT} \
          -b ${KICAD_BOARD}.kicad_pcb \
          -s draw_fancy_stackup,set_text_variables,erc,drc \
          -g variant=${KIBOT_VARIANT} \
          md_readme 2> ../log/kibot_readme.log
        cd ..
      fi

    # -------------------------------------------------------------------------
    # KiBot: Generate main outputs
    # -------------------------------------------------------------------------
    - |
      cd ${KIBOT_INPUT_DIR}
      kibot -vvvv -c ${KIBOT_CONFIG} \
        -d ${KIBOT_OUTPUT_PATH}/${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT} \
        -b ${KICAD_BOARD}.kicad_pcb \
        -g variant=${KIBOT_VARIANT} \
        -E PDF_REPORT_ROOT_DIR=${KIBOT_OUTPUT_PATH}/${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT} \
        -E "REVISION=${KIBOT_REVISION}" \
        ${additional_args} 2> ../log/kibot_output.log
      cd ..

    # -------------------------------------------------------------------------
    # KiCost: Cost estimation (up to 10 attempts due to Mouser API rate limit)
    # -------------------------------------------------------------------------
    - |
      cd ${KIBOT_INPUT_DIR}
      revision=$(python3 kibot_resources/scripts/get_changelog_version.py -f CHANGELOG.md 2>/dev/null || echo "")
      for attempt in $(seq 1 10); do
        echo "--- KiCost attempt ${attempt}/10 ---"
        kibot -vvvv --skip-pre erc,drc,draw_fancy_stackup \
          -c kibot_yaml/kibot_main.yaml \
          -d ${KIBOT_OUTPUT_PATH}/${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT} \
          -g variant=${KIBOT_VARIANT} \
          -E KICOST_CONFIG=kibot_yaml/kicost_config_local.yaml \
          xlsx_bom 2>> ../log/kicost_output.log || true
        if [ ${attempt} -lt 3 ]; then
          echo "Waiting 61s for Mouser API rate limit to reset..."
          sleep 61
        fi
      done
      cd ..

    # -------------------------------------------------------------------------
    # Clean up
    # -------------------------------------------------------------------------
    - |
      rm -rf ${KICAD_LIBRARY}
      find . -type f -iname '*.ogv' -delete
      find . -type f -iname '*.kicad_pro-bak' -delete
      rm -f ${KIBOT_INPUT_DIR}/kibot_*.kicad_pro
      rm -f ${KIBOT_INPUT_DIR}/kibot_*.kicad_pcb
      git checkout HEAD -- '*.kicad_pcb' 2>/dev/null || true

    # -------------------------------------------------------------------------
    # Commit and push results
    # -------------------------------------------------------------------------
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        git add -A
        git commit -m "Update outputs (release)" || echo "No changes"
        DETACHED_COMMIT=$(git rev-parse HEAD)
        git fetch origin main
        git checkout main
        git merge --no-ff ${DETACHED_COMMIT} -m "Merge outputs from tag-triggered pipeline" -X theirs
        git push origin main
      else
        git pull origin ${CI_COMMIT_BRANCH} --tags --rebase --force 2>/dev/null || true
        git add -A
        git commit -m "Push outputs from CI/CD (${DATE})" || echo "No changes"
        git push origin ${CI_COMMIT_BRANCH}
      fi

  artifacts:
    name: "${KIBOT_VARIANT}"
    paths:
      - ${KIBOT_OUTPUT_DIR}-*/
      - log/
    expire_in: 7 days
    when: always

# ---------------------------------------------------------------------------
# release - Create GitLab Release (tag pushes only)
# ---------------------------------------------------------------------------
pcb:release:
  stage: deploy
  image: ghcr.io/inti-cmnb/kicad9_auto_full:latest
  needs:
    - job: pcb:generate_outputs
      artifacts: true

  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

  variables:
    KIBOT_VARIANT: "RELEASED"

  script:
    - apt-get update -qq
    - apt-get install -y -qq zip

    - |
      release_notes=$(python3 -c "
      import re, sys
      content = open('${KIBOT_INPUT_DIR}/CHANGELOG.md').read()
      m = re.search(r'## \[' + re.escape('${CI_COMMIT_TAG}') + r'\].*?\n(.*?)(?=\n## \[)', content, re.DOTALL)
      if m:
          print(m.group(1).strip())
      else:
          m2 = re.search(r'## \[Unreleased\](.*?)(?=\n## \[)', content, re.DOTALL)
          print(m2.group(1).strip() if m2 else 'No release notes found.')
      " 2>/dev/null || echo "No release notes found.")

    - zip -r ${KICAD_BOARD}.zip ${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT}/ 2>/dev/null || echo "No production directory found"

    - |
      curl --fail-with-body \
        --header "PRIVATE-TOKEN: ${WORKFLOW_PAT}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"Release ${CI_COMMIT_TAG}\",
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"description\": \"${release_notes}\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" || \
      echo "Release may already exist"

    - |
      upload_response=$(curl --fail-with-body \
        --header "PRIVATE-TOKEN: ${WORKFLOW_PAT}" \
        --form "file=@${KICAD_BOARD}.zip" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads")
      asset_url=$(echo "${upload_response}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('${CI_PROJECT_URL}' + d['url'])")
      curl --fail-with-body \
        --request POST \
        --header "PRIVATE-TOKEN: ${WORKFLOW_PAT}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"${KICAD_BOARD}.zip\",
          \"url\": \"${asset_url}\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

  artifacts:
    paths:
      - "*.zip"
    expire_in: 30 days

# ---------------------------------------------------------------------------
# pages - GitLab Pages (tag pushes or main/master only)
# ---------------------------------------------------------------------------
pcb:pages:
  stage: deploy
  needs:
    - job: pcb:generate_outputs
      artifacts: true

  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        KIBOT_VARIANT="RELEASED"
      fi
    - mkdir -p public
    - cp -r ${KIBOT_OUTPUT_DIR}-${KIBOT_VARIANT}/. public/ 2>/dev/null || echo "No production directory found"

  artifacts:
    paths:
      - public
    expire_in: 30 days
