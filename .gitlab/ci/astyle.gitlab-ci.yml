# =============================================================================
# Pipeline: Code Style Check (AStyle)
# =============================================================================
#
# Trigger:
#   - Manually via GitLab UI (web trigger)
#   - Merge request: on open, synchronize, or reopen targeting any branch
#   - Push to branches 'main', 'master', or 'dev'
#
# Function:
#   Checks the code style of the repository using AStyle. AStyle is built from
#   source and the repository's 'scripts/bash/format.sh' script is executed in
#   dry-run mode to report style violations without modifying any files.
#
# Variables:
#   (none)
#
# Secrets:
#   (none)
# =============================================================================

astyle:check:
  stage: test
  image: ubuntu:latest

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|dev)$/ && $CI_PIPELINE_SOURCE == "push"'

  before_script:
    - apt-get update -qq
    - apt-get install -y -qq lbzip2 build-essential cmake pkg-config wget
    - wget -q https://sourceforge.net/projects/astyle/files/astyle/astyle%203.6/astyle-3.6.13.tar.bz2/download -O astyle.tar.bz2
    - tar -xf astyle.tar.bz2
    - cd astyle-3.6.13 && mkdir -p build && cd build && cmake ../ && make && make install && cd ../..

  script:
    - chmod +x ./scripts/bash/format.sh
    - ./scripts/bash/format.sh
