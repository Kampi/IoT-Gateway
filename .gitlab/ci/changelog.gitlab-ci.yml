# =============================================================================
# Pipeline: Changelog Check
# =============================================================================
#
# Trigger:
#   - Merge request targeting 'main' or 'master'
#   - Push to 'main', 'master' or 'dev'
#
# Function:
#   Validates that CHANGELOG.md exists in the KiCad project directory and is
#   correctly formatted. Checks that an [Unreleased] section is present and
#   that its content only contains valid section headers ("**Added:**",
#   "**Changed:**", "**Fixed:**", "**Removed:**") and correctly formatted
#   entries. Fails the pipeline if the format is invalid.
#
# Variables:
#   BOARD_NAME_ANCHOR   - Directory containing the KiCad project's CHANGELOG.md
#                         (replaced by the init script at project creation)
# =============================================================================

changelog:validate:
  stage: test
  image: alpine:latest

  variables:
    BOARD_NAME_ANCHOR: "gateway"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|dev)$/ && $CI_PIPELINE_SOURCE == "push"'

  before_script:
    - apk add --no-cache bash grep sed gawk

  script:
    - |
      CHANGELOG_FILE="gateway/CHANGELOG.md"

      if [ ! -f "${CHANGELOG_FILE}" ]; then
        echo "Error: CHANGELOG.md not found in 'gateway'"
        exit 1
      fi

      echo "Validating CHANGELOG.md format..."

      if ! grep -q "\[Unreleased\]" "${CHANGELOG_FILE}"; then
        echo "Error: [Unreleased] section not found in CHANGELOG.md"
        exit 1
      fi

      UNRELEASED_CONTENT=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' "${CHANGELOG_FILE}")

      if [ -z "${UNRELEASED_CONTENT}" ]; then
        echo "Warning: [Unreleased] section is empty"
        exit 0
      fi

      echo "Checking [Unreleased] section content..."

      VALID_SECTIONS="**Added:** **Changed:** **Fixed:** **Removed:**"
      FOUND_SECTIONS=false
      for section in ${VALID_SECTIONS}; do
        if echo "${UNRELEASED_CONTENT}" | grep -q "^${section}"; then
          FOUND_SECTIONS=true
          echo "Found section: ${section}"
        fi
      done

      if [ "${FOUND_SECTIONS}" = "false" ]; then
        echo "Error: No valid sections found in [Unreleased] block"
        echo "Expected sections: Added, Changed, Fixed, Removed"
        exit 1
      fi

      ERROR_COUNT=0
      LINE_NUMBER=0

      echo ""
      echo "Validating entry format..."

      while IFS= read -r line; do
        LINE_NUMBER=$((LINE_NUMBER + 1))

        if [ -z "$line" ] || echo "$line" | grep -qE '^### '; then
          continue
        fi

        if echo "$line" | grep -qE '^[[:space:]]*-'; then
          if ! echo "$line" | grep -qE '\(#[0-9]+\)'; then
            echo "Line ${LINE_NUMBER}: Missing or invalid issue reference (expected format: (#123))"
            echo "  Content: ${line}"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          else
            echo "Line ${LINE_NUMBER}: Valid entry"
          fi
        elif echo "$line" | grep -qE '^[[:space:]]*[^-]'; then
          echo "Line ${LINE_NUMBER}: Entry must start with '- ' (dash + space)"
          echo "  Content: ${line}"
          ERROR_COUNT=$((ERROR_COUNT + 1))
        fi
      done <<EOF
      ${UNRELEASED_CONTENT}
      EOF

      echo ""
      if [ ${ERROR_COUNT} -gt 0 ]; then
        echo "=========================================="
        echo "Changelog validation FAILED"
        echo "=========================================="
        echo "Errors found: ${ERROR_COUNT}"
        echo ""
        echo "Requirements:"
        echo "1. All entries must be grouped under: Added, Changed, Fixed, or Removed"
        echo "2. Each entry must start with '- ' (dash + space)"
        echo "3. Each entry must contain an issue reference in format (#number)"
        echo ""
        echo "Example:"
        echo "## [Unreleased]"
        echo ""
        echo "**Added:**"
        echo "- New feature description (#123)"
        echo ""
        echo "**Fixed:**"
        echo "- Bug fix description (#124)"
        exit 1
      else
        echo "=========================================="
        echo "Changelog validation PASSED"
        echo "=========================================="
        echo "All entries in [Unreleased] are properly formatted"
      fi

changelog:check-duplicates:
  stage: test
  image: alpine:latest

  variables:
    BOARD_NAME_ANCHOR: "gateway"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|dev)$/ && $CI_PIPELINE_SOURCE == "push"'

  before_script:
    - apk add --no-cache bash grep sed gawk

  script:
    - |
      CHANGELOG_FILE="gateway/CHANGELOG.md"

      if [ ! -f "${CHANGELOG_FILE}" ]; then
        echo "Error: CHANGELOG.md not found in 'gateway'"
        exit 1
      fi

      echo "Checking for duplicate issue references..."

      ISSUES=$(grep -oE '\(#[0-9]+\)' "${CHANGELOG_FILE}" | sort)
      DUPES=$(echo "${ISSUES}" | uniq -d)

      if [ -n "${DUPES}" ]; then
        echo "Error: Duplicate issue references found:"
        echo "${DUPES}"
        exit 1
      else
        echo "No duplicate issue references found"
      fi
